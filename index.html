<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>远程</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--edge:#d1d5db;--accent:#2563eb;--tint:#eff6ff;--warn-bg:#fffbeb;--warn:#b45309;--ok-bg:#f0fdf4;--ok:#15803d;--danger:#b91c1c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
.banner{flex:none;margin:0;padding:8px 16px;border-bottom:.5px solid #fde68a;background:var(--warn-bg);color:var(--warn);font-size:12px}
.app{display:flex;flex:1;min-height:0;background:var(--panel)}
.side,.main{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
.app[data-depth="list"] .main,.app[data-depth="detail"] .side{display:none}

.top{display:flex;align-items:center;gap:4px;flex:none;min-height:52px;padding:0 8px;border-bottom:.5px solid var(--line)}
.top h1{flex:1;min-width:0;margin:0;padding:0 8px;font-size:16px;font-weight:600;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--accent)}
.icon:disabled{opacity:.5}
@media (hover:hover){.icon:hover,.row:hover{background:var(--bg)}}

.side-top{order:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;flex:none;order:3;border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{height:48px;border:0;background:transparent;color:var(--mute)}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.side-body{order:2;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.side-foot{padding:12px 16px 16px}
.side-foot button{height:32px;padding:0;border:0;background:transparent;font-size:12px;color:var(--mute)}

.list{margin:0;padding:0;list-style:none}
.row{display:block;width:100%;padding:10px 16px;border:0;border-bottom:.5px solid var(--line);background:transparent;text-align:left}
.row[aria-current="true"]{background:var(--tint)}
.line{display:flex;align-items:center;gap:8px;min-width:0}
.name{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:0 8px;font-size:12px;color:var(--mute)}
.tag{display:inline-block;max-width:100%;margin:4px 4px 0 0;padding:0 8px;font-size:12px;line-height:20px;border-radius:4px;background:var(--bg);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.loading{margin:0;padding:48px 16px;text-align:center;color:var(--mute);list-style:none}

.tools{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:.5px solid var(--line)}
.upload{flex:none;height:36px;padding:0 12px;border:.5px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff}
.upload:disabled{opacity:.5}
.hint{margin:0;min-width:0;font-size:12px;color:var(--mute)}
.chips{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:.5px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:28px;padding:0 10px;border:.5px solid var(--edge);border-radius:14px;background:var(--panel);font-size:12px;color:var(--mute);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);color:var(--accent)}

.pill{display:inline-flex;align-items:center;gap:4px;flex:none;padding:0 8px;font-size:12px;line-height:20px;border-radius:10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:3px;background:currentColor}
.s-queued,.s-sent{background:#f3f4f6;color:var(--mute)}
.s-recv,.s-busy{background:var(--tint);color:var(--accent)}
.s-done{background:var(--ok-bg);color:var(--ok)}
.s-mac{background:var(--warn-bg);color:var(--warn)}

.main-body{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
#v-none{align-items:center;justify-content:center;color:var(--mute)}

.scroller{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.thread{max-width:800px;margin:0 auto;padding:0 16px 24px}
.older{display:flex;justify-content:center;padding:16px 0 0}
.older button{height:32px;padding:0 14px;border:.5px solid var(--edge);border-radius:16px;background:var(--panel);font-size:12px;color:var(--mute)}
.older button:disabled{color:var(--accent);border-color:var(--accent);cursor:default}
.older p{margin:0;font-size:12px;color:var(--mute)}
.round{padding:16px 0;border-bottom:.5px solid var(--line)}
.round:last-child{border-bottom:0}
.who{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:12px;color:var(--mute)}
.who b{font-weight:600;color:var(--ink)}
.who b.ai{color:var(--accent)}
.who .pill{margin-left:auto}
.ask{margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--bg);white-space:pre-wrap;overflow-wrap:anywhere}
.reply{line-height:1.75;overflow-wrap:anywhere}
.reply.clamp{max-height:280px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.toggle{margin:8px 0 0;padding:0;border:0;background:transparent;font-size:12px;color:var(--accent)}
.wait{margin:0;color:var(--mute)}

.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md table,.md blockquote{margin:0 0 12px}
.md h1,.md h2{margin:20px 0 8px;font-size:16px;line-height:1.5}
.md h3,.md h4,.md h5,.md h6{margin:16px 0 6px;font-size:14px;line-height:1.5}
.md ul,.md ol{padding-left:1.4em}
.md li+li{margin-top:2px}
.md a{color:var(--accent)}
.md code{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f3f4f6;padding:1px 4px;border-radius:4px}
.md pre{padding:10px 12px;border:.5px solid var(--line);border-radius:6px;background:var(--bg);overflow-x:auto}
.md pre code{padding:0;background:none}
.md blockquote{padding:8px 12px;background:var(--bg);color:#4b5563}
.md table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}
.md th,.md td{padding:6px 10px;border:.5px solid var(--edge);text-align:left;vertical-align:top}
.md th{background:var(--bg);font-weight:600}
.md hr{margin:16px 0;border:0;border-top:.5px solid var(--line)}

.compose{flex:none;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:.5px solid var(--line);background:var(--panel)}
.compose-in{display:flex;align-items:flex-end;gap:8px;max-width:800px;margin:0 auto}
textarea{flex:1;min-width:0;max-height:160px;padding:8px 10px;border:.5px solid var(--edge);border-radius:6px;background:var(--panel);font-size:16px;line-height:1.5;resize:none}
.send{flex:none;height:40px;padding:0 14px;border:0;border-radius:6px;background:var(--accent);color:#fff}
.send:disabled{opacity:.5}

#v-file{overflow:auto;-webkit-overflow-scrolling:touch}
.file-main,.file-side{display:contents}
.fhead{flex:none;padding:10px 16px;border-bottom:.5px solid var(--line)}
.fhead .tag{margin-top:0}
.fpath{overflow-wrap:anywhere}
.frame{display:block;flex:none;width:100%;height:60vh;height:60dvh;border:0;border-bottom:.5px solid var(--line);background:#fff}
.cmts{flex:1 0 auto;margin:0;padding:0 16px;list-style:none}
.cmt{padding:10px 0;border-bottom:.5px solid var(--line)}
.cmt:last-child{border-bottom:0}
.cmt p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmts .loading{padding:24px 0}
#v-file .compose{position:sticky;bottom:0}

.note{position:fixed;top:60px;left:50%;z-index:8;max-width:calc(100% - 32px);margin:0;padding:8px 12px;border:.5px solid #fecaca;border-radius:6px;background:#fef2f2;color:var(--danger);font-size:12px;white-space:pre-line;transform:translateX(-50%)}
.note:empty{display:none}

.gate{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--panel)}
.gate form{display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px}
.gate label{font-weight:600}
.gate input{height:40px;padding:0 10px;border:.5px solid var(--edge);border-radius:6px;font-size:16px}
.gate .send{width:100%}
.gate p{margin:0;font-size:12px;color:var(--danger)}
.gate p:empty{display:none}
#drop{position:fixed;inset:8px;z-index:7;display:none;align-items:center;justify-content:center;border:.5px dashed var(--accent);border-radius:8px;background:rgba(246,247,249,.92);color:var(--accent);font-weight:600}
.app.drag #drop{display:flex}

@media (min-width:900px){
  .app[data-depth] .side,.app[data-depth] .main{display:flex}
  .side{flex:none;width:320px;border-right:.5px solid var(--line);background:var(--panel)}
  .side-top .icon{display:none}
  .tabs{order:1;gap:4px;padding:8px 12px;border-top:0;border-bottom:.5px solid var(--line)}
  .tabs button{height:32px;border-radius:6px}
  .tabs button[aria-current="page"]{background:var(--tint)}
  .thread{padding:0 32px 32px}
  #v-file{flex-direction:row;overflow:hidden}
  .file-main{display:flex;flex-direction:column;flex:1;min-width:0}
  .frame{flex:1;height:auto;border-bottom:0}
  .file-side{display:flex;flex-direction:column;flex:none;width:360px;border-left:.5px solid var(--line)}
  .file-side .cmts{flex:1;min-height:0;overflow:auto}
  #v-file .compose{position:static}
}
</style>
</head>
<body>
<div class="shell">
<p class="banner" id="banner" role="status" hidden></p>
<div class="app" id="app" data-depth="list">
  <aside class="side" aria-label="列表">
    <header class="top side-top">
      <h1 id="sideTitle">最近对话</h1>
      <button class="icon" type="button" data-refresh>刷新</button>
    </header>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="convs">对话</button>
      <button type="button" data-tab="files">文件</button>
    </nav>
    <div class="side-body">
      <section id="v-convs"><ul class="list" id="convList"><li class="loading">正在加载…</li></ul></section>
      <section id="v-files" hidden>
        <div class="tools"><button class="upload" id="upload" type="button">上传文件</button><p class="hint" id="upHint" role="status"></p></div>
        <div class="chips" id="chips" role="group" aria-label="按对话筛选"></div>
        <ul class="list" id="fileList"><li class="loading">正在加载…</li></ul>
      </section>
      <div class="side-foot"><button type="button" id="btnToken">更换令牌</button></div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="icon" id="back" type="button" aria-label="返回" hidden>‹</button>
      <h1 id="mainTitle"></h1>
      <button class="icon" type="button" data-refresh>刷新</button>
    </header>
    <div class="main-body">
      <section class="view" id="v-none"><p id="noneMsg">正在加载…</p></section>

      <section class="view" id="v-conv" hidden>
        <div class="scroller" id="convScroll">
          <div class="thread">
            <div class="older" id="olderBox" hidden><button id="older" type="button">加载更早的 5 轮</button></div>
            <div class="older" id="cappedBox" hidden><p>更早的内容请在 Mac 上查看</p></div>
            <div id="rounds" role="log" aria-live="polite"></div>
          </div>
        </div>
        <form class="compose" id="convForm">
          <div class="compose-in">
            <textarea rows="1" maxlength="8000" placeholder="继续对话" aria-label="消息内容"></textarea>
            <button class="send" type="submit">发送</button>
          </div>
        </form>
      </section>

      <section class="view" id="v-file" hidden>
        <div class="file-main">
          <div class="fhead" id="fhead"></div>
          <iframe class="frame" id="frame" title="文件预览"></iframe>
        </div>
        <div class="file-side">
          <ul class="cmts" id="cmts" role="log" aria-live="polite"></ul>
          <form class="compose" id="fileForm">
            <div class="compose-in">
              <textarea rows="1" maxlength="2000" placeholder="评论这份文件" aria-label="评论内容"></textarea>
              <button class="send" type="submit">发送</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>
  <div id="drop">松开上传</div>
</div>
</div>

<p class="note" id="note" role="status"></p>

<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <label for="key">访问令牌</label>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_">
    <button class="send" type="submit">保存</button>
    <p id="gateNote" role="status"></p>
  </form>
</div>

<input type="file" id="picker" multiple hidden accept=".md,.markdown,.html,.htm,.png,.jpg,.jpeg,.gif,.webp,.avif,.svg">

<script>
// 内容来自私有仓库 TrisYang/Remote：live 分支是 Mac 同步上来的对话和文件，消息、评论和上传写进 inbox 分支，由 Mac 接收处理。
const REPO_API = 'https://api.github.com/repos/TrisYang/Remote';
const POLL_MS = 10000;
const OFFLINE_MS = 5 * 60e3;
const MAX_FILE = 20 * 1024 * 1024;
const STEP = 5;
const EXTS = new Set(['md', 'markdown', 'html', 'htm', 'png', 'jpg', 'jpeg', 'gif', 'webp', 'avif', 'svg']);

const $ = (s) => document.querySelector(s);
const app = $('#app');
const wide = matchMedia('(min-width: 900px)');
const STATUS = { queued: '已发送', sent: '已发送', recv: '已接收', busy: '处理中', done: '已回复', mac: '需回 Mac 处理' };
const WAIT = { queued: '等待 Mac 接收', sent: '等待转给对话', recv: '已转给对话，等待开始', busy: 'Claude 正在处理', mac: '需要回到 Mac 上处理' };
const FROM = { user: '我', phone: '我（手机）', peer: '其他对话' };
const KIND = { md: 'MD', html: 'HTML', img: '图片' };
const OLDER = '加载更早的 5 轮';
const msgDoc = (t) => `<!doctype html><meta charset="utf-8"><body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font:14px -apple-system,'PingFang SC',sans-serif;color:#6b7280">${t}</body>`;

let TOKEN = '';
try {
  TOKEN = localStorage.getItem('rv-token') || '';
} catch {}

let route = { name: '', id: '' };
let filter = '';
let head = '';
let refTag = '';
let paths = new Map();
let syncedAt = 0;
let acks = new Map();
let pending = [];
let upBatch = null;
let convs = [];
let convSig = '';
let files = [];
let chips = [];
let filesSig = '';
let conv = null;
let shownFile = '';
let fileCmts = { id: '', list: [] };
let lastConv = '';
let lastFile = '';
let busy = false;
let again = false;
let againForce = false;
let noteSticky = false;
const expanded = new Set();
const blobs = new Map();

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const pad = (n) => String(n).padStart(2, '0');
function when(ts) {
  const d = new Date(ts);
  const now = new Date();
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 864e5);
  if (diff === 0) return hm;
  if (diff === 1) return `昨天 ${hm}`;
  return `${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${hm}`;
}
const pill = (s) => (s && STATUS[s] ? el('span', `pill s-${s}`, STATUS[s]) : null);
function note(t, sticky = false) {
  $('#note').textContent = t || '';
  noteSticky = !!t && sticky;
}
const errText = (e) => (e instanceof TypeError ? '网络连接失败，稍后再试' : e.message);
const rand = (n) => [...crypto.getRandomValues(new Uint8Array(n))].map((b) => b.toString(16).padStart(2, '0')).join('');
const newId = () => `${Date.now()}-${rand(3)}`;

const fromB64 = (b64) => Uint8Array.from(atob(b64.replace(/\s/g, '')), (c) => c.charCodeAt(0));
function toB64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
const utf8 = new TextDecoder();
const textOf = (bytes) => utf8.decode(bytes);
const jsonB64 = (obj) => toB64(new TextEncoder().encode(JSON.stringify(obj) + '\n'));

const auth = () => ({ Accept: 'application/vnd.github+json', Authorization: `Bearer ${TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' });
async function ghError(r) {
  const j = await r.json().catch(() => ({}));
  const msg = r.status === 403 && /rate limit/i.test(j.message || '') ? '请求太频繁，稍后再试' : j.message || '请求失败';
  return Object.assign(new Error(msg), { status: r.status });
}
async function gh(path, opts = {}) {
  const headers = auth();
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch(REPO_API + path, { cache: 'no-store', ...opts, headers });
  if (!r.ok) throw await ghError(r);
  return r.json();
}

function blob(sha) {
  if (!blobs.has(sha))
    blobs.set(
      sha,
      gh(`/git/blobs/${sha}`)
        .then((j) => fromB64(j.content))
        .catch((e) => {
          blobs.delete(sha);
          throw e;
        })
    );
  return blobs.get(sha);
}
const readText = async (p) => {
  const sha = paths.get(p);
  return sha ? textOf(await blob(sha)) : null;
};
async function readJson(p) {
  const t = await readText(p);
  if (t == null) return null;
  try {
    return JSON.parse(t);
  } catch {
    return null;
  }
}

// 分支没变时 GitHub 回 304，不占请求额度
async function pull(force) {
  const headers = auth();
  if (refTag && !force) headers['If-None-Match'] = refTag;
  const r = await fetch(`${REPO_API}/git/ref/heads/live`, { cache: 'no-store', headers });
  if (r.status === 304) return false;
  if (!r.ok) throw await ghError(r);
  const j = await r.json();
  refTag = r.headers.get('etag') || '';
  const sha = j.object.sha;
  if (sha === head) return false;
  const tree = await gh(`/git/trees/${sha}?recursive=1`);
  const next = new Map(tree.tree.filter((e) => e.type === 'blob').map((e) => [e.path, e.sha]));
  const keep = new Set(next.values());
  for (const k of blobs.keys()) if (!keep.has(k)) blobs.delete(k);
  paths = next;
  head = sha;
  const [m, a] = await Promise.all([readJson('meta.json'), readJson('acks.json')]);
  syncedAt = m?.syncedAt || 0;
  acks = new Map((a?.acks || []).map((x) => [x.id, x]));
  settle();
  return true;
}

function settle() {
  const errs = [];
  pending = pending.filter((p) => {
    const a = acks.get(p.id);
    if (!a) return true;
    if (!a.ok) errs.push(`${p.type === 'upload' ? p.name : p.type === 'comment' ? '评论' : '消息'}发送失败：${a.error}`);
    else if (p.type === 'upload' && upBatch?.ids.has(p.id)) upBatch.last = a.ref;
    return false;
  });
  if (errs.length) note(errs.join('\n'), true);
  if (upBatch && !pending.some((p) => upBatch.ids.has(p.id))) {
    const last = upBatch.last;
    upBatch = null;
    $('#upHint').textContent = '';
    if (last && sideTab() === 'files') go(`f/${last}`);
  }
}

function banner() {
  const b = $('#banner');
  const off = !!syncedAt && Date.now() - syncedAt > OFFLINE_MS;
  b.hidden = !off;
  if (off) b.textContent = `Mac 不在线，显示的是 ${when(syncedAt)} 的内容，新发的消息会在 Mac 上线后处理`;
}

// 一次提交写入多个文件；分支被 Mac 先改过时重取最新再提交
async function commitInbox(entries, message) {
  const tree = await Promise.all(
    entries.map(async (e) => ({
      path: e.path,
      mode: '100644',
      type: 'blob',
      sha: (await gh('/git/blobs', { method: 'POST', body: JSON.stringify({ content: e.b64, encoding: 'base64' }) })).sha,
    }))
  );
  for (let i = 0; ; i++) {
    let base;
    try {
      base = (await gh('/git/ref/heads/inbox')).object.sha;
    } catch (e) {
      if (e.status === 404) throw Object.assign(new Error('Mac 还没开始同步，稍后再试'), { status: 0 });
      throw e;
    }
    const baseTree = (await gh(`/git/commits/${base}`)).tree.sha;
    const t = await gh('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: baseTree, tree }) });
    const c = await gh('/git/commits', { method: 'POST', body: JSON.stringify({ message, tree: t.sha, parents: [base] }) });
    try {
      await gh('/git/refs/heads/inbox', { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) });
      return;
    } catch (e) {
      if (e.status !== 422 || i >= 4) throw e;
    }
  }
}

function forgetToken() {
  TOKEN = '';
  try {
    localStorage.removeItem('rv-token');
  } catch {}
}
function askToken(msg) {
  $('#gate').hidden = false;
  $('#gateNote').textContent = msg || '';
  note('');
  $('#key').focus();
}

function parseHash() {
  const h = location.hash.slice(1);
  let m;
  if ((m = h.match(/^c\/([0-9a-f-]{36})$/))) return { name: 'conv', id: m[1] };
  if ((m = h.match(/^f\/([0-9a-fc]{10,13})$/))) return { name: 'file', id: m[1] };
  if (h === 'files') return { name: 'files', id: '' };
  return { name: 'convs', id: '' };
}
const go = (hash) => {
  if (location.hash.slice(1) === hash) render(true);
  else location.hash = hash;
};
const sideTab = () => (route.name === 'files' || route.name === 'file' ? 'files' : 'convs');
const isDetail = () => route.name === 'conv' || route.name === 'file';

function layout() {
  const tab = sideTab();
  app.dataset.depth = isDetail() ? 'detail' : 'list';
  $('#v-convs').hidden = tab !== 'convs';
  $('#v-files').hidden = tab !== 'files';
  $('#v-conv').hidden = route.name !== 'conv';
  $('#v-file').hidden = route.name !== 'file';
  $('#v-none').hidden = isDetail();
  $('#sideTitle').textContent = wide.matches ? '远程' : tab === 'convs' ? '最近对话' : '文件';
  $('#back').hidden = wide.matches || !isDetail();
  for (const b of document.querySelectorAll('.tabs button')) {
    if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  }
}

function markCurrent() {
  for (const b of document.querySelectorAll('.row[data-id]')) {
    if (isDetail() && b.dataset.id === route.id) b.setAttribute('aria-current', 'true');
    else b.removeAttribute('aria-current');
  }
}

function render(fresh) {
  if (!TOKEN) return askToken('');
  const r = parseHash();
  const moved = r.name !== route.name || r.id !== route.id;
  route = r;
  layout();
  if (moved) {
    if (!noteSticky) note('');
    if (r.name === 'conv') openConv(r.id);
    else if (r.name === 'file') openFile(r.id);
    else $('#mainTitle').textContent = '';
    if (r.name !== 'conv') conv = null;
    markCurrent();
  }
  sync(fresh || moved);
}

async function sync(force) {
  if (!TOKEN || !$('#gate').hidden) return;
  if (busy) {
    again = true;
    againForce ||= force;
    return;
  }
  busy = true;
  try {
    const changed = await pull(force);
    if (changed || force) await draw(force);
    if (!noteSticky) note('');
  } catch (e) {
    if (e.status === 401) {
      forgetToken();
      askToken('令牌已失效，请重新填写');
    } else if (e.status === 404) {
      try {
        await gh('');
        $('#noneMsg').textContent = 'Mac 还没开始同步';
        $('#convList').replaceChildren(el('li', 'loading', 'Mac 还没开始同步'));
      } catch (x) {
        if (x.status === 401 || x.status === 404) {
          forgetToken();
          askToken('令牌没有 Remote 仓库的访问权限');
        } else note(errText(x));
      }
    } else note(errText(e));
  } finally {
    banner();
    busy = false;
    if (again) {
      const f = againForce;
      again = false;
      againForce = false;
      sync(f);
    }
  }
}

async function draw(force) {
  const jobs = [];
  if (wide.matches || !isDetail()) jobs.push(sideTab() === 'convs' ? loadConvs() : loadFiles(force));
  if (route.name === 'conv') jobs.push(loadConv(route.id));
  if (route.name === 'file') jobs.push(loadFile(route.id, force));
  const res = await Promise.allSettled(jobs);
  const bad = res.find((x) => x.status === 'rejected');
  if (bad) throw bad.reason;
}

const pendingRounds = (id) =>

const roundsOf = (s) => [...s.map.values(), ...pendingRounds(s.id)].sort((a, b) => a.ts - b.ts);

async function loadConv(id) {
  const d = await readJson(`conv/${id}.json`);
  const s = conv;
  if (route.name !== 'conv' || !s || s.id !== id) return;
  if (!d) {
    $('#rounds').replaceChildren(el('p', 'loading', '这个对话已不在最近 10 个里'));
    $('#convForm').hidden = true;
    return;
  }
  $('#convForm').hidden = false;
  $('#mainTitle').textContent = d.title;
  const prevLast = roundsOf(s).at(-1)?.key;
  for (const r of d.rounds) s.map.set(r.key, r);
  s.more = d.more;
  s.capped = d.capped;
  if (s.fresh) {
    s.fresh = false;
    drawConv('latest');
  } else drawConv(roundsOf(s).at(-1)?.key !== prevLast ? 'new' : 'keep');
}

function roundEl(r, isLast) {
  const art = el('article', 'round');
  const who = el('div', 'who');
  who.append(el('b', null, FROM[r.from] || '我'), el('span', null, when(r.ts)));
  const p = pill(r.status);
  if (p) who.append(p);
  art.append(who, el('p', 'ask', r.ask));
  if (r.html) {
    const ai = el('div', 'who');
    ai.append(el('b', 'ai', 'Claude'));
    const body = el('div', 'reply md');
    body.innerHTML = r.html;
    art.append(ai, body);
    if (!isLast && r.long) {
      const open = expanded.has(r.key);
      if (!open) body.classList.add('clamp');
      const t = el('button', 'toggle', open ? '收起' : '展开全文');
      t.type = 'button';
      t.onclick = () => {
        if (expanded.has(r.key)) expanded.delete(r.key);
        else expanded.add(r.key);
        drawConv('keep');
      };
      art.append(t);
    }
  } else if (r.status && r.status !== 'done') {
    art.append(el('p', 'wait', WAIT[r.status]));
  }
  return art;
}

function drawConv(mode) {
  const s = conv;
  if (!s || s.fresh) return;
  const box = $('#convScroll');
  const nearBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
  const rounds = roundsOf(s);
  const canMore = s.older ? s.shown < s.older.length : s.more;
  const capped = !canMore && (s.older ? s.olderMore : s.capped);
  const sig = JSON.stringify([rounds.map((r) => [r.key, r.status, r.html.length]), canMore, capped, [...expanded]]);
  if (mode === 'keep' && sig === s.sig) return;
  s.sig = sig;
  $('#olderBox').hidden = !canMore;
  $('#cappedBox').hidden = !capped;
  const wrap = $('#rounds');
  if (!rounds.length) {
    wrap.replaceChildren(el('p', 'loading', '这个对话还没有内容'));
    return;
  }
  const last = rounds.length - 1;
  wrap.replaceChildren(...rounds.map((r, i) => roundEl(r, i === last)));
  if (mode === 'latest' || (mode === 'new' && nearBottom)) wrap.lastElementChild.scrollIntoView({ block: 'start' });
}

function wireForm(form, submit) {

  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) form.requestSubmit();
  });
  form.onsubmit = async (e) => {
    e.preventDefault();
    const text = ta.value.trim();
    if (!text || btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '发送中';
    try {
      await submit(text, route.id);
      ta.value = '';
      ta.style.height = '';
    } catch (err) {
      if (err.status === 401) {
        forgetToken();
        askToken('令牌已失效，请重新填写');
      } else note(`发送失败：${errText(err)}`, true);
    }
    btn.disabled = false;
    btn.textContent = '发送';
  };
}

function cleanName(raw) {
  let n = String(raw || '')
    .normalize('NFC')
    .replace(/[\u0000-\u001f\u007f]/g, '')
    .split(/[\\/]/)
    .pop()
    .trim();
  const dot = n.lastIndexOf('.');
  const ext = dot > 0 ? n.slice(dot) : '';
  if (n.length > 120) n = n.slice(0, 120 - ext.length) + ext;
  return n;
}

async function upload(list) {
  const errors = [];
  const entries = [];
  const items = [];
  for (const file of list) {
    const name = cleanName(file.name);
    const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
    if (!EXTS.has(ext)) errors.push(`${name}：仅支持 md、html 和图片`);
    else if (!file.size) errors.push(`${name}：文件为空`);
    else if (file.size > MAX_FILE) errors.push(`${name}：文件超过 20MB`);
    else {
      const id = newId();
      const bin = `inbox/${id}.bin`;
      entries.push({ path: bin, b64: toB64(new Uint8Array(await file.arrayBuffer())) });
      entries.push({ path: `inbox/${id}.json`, b64: jsonB64({ type: 'upload', name, blob: bin }) });
      items.push({ id, type: 'upload', name, at: Date.now() });
    }
  }
  const btn = $('#upload');
  if (items.length) {
    btn.disabled = true;
    btn.textContent = '上传中';
    try {
      await commitInbox(entries, '手机上传');
      pending.push(...items);
      upBatch = { ids: new Set(items.map((x) => x.id)), last: '' };
      $('#upHint').textContent = `已上传 ${items.length} 个文件，等待 Mac 接收`;
    } catch (e) {
      if (e.status === 401) {
        forgetToken();
        askToken('令牌已失效，请重新填写');
      } else errors.push(`上传失败：${errText(e)}`);
    }
    btn.disabled = false;
    btn.textContent = '上传文件';
  }
  note(errors.join('\n'), true);
}

});
